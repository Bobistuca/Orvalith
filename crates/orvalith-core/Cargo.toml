[package]
name = "orvalith-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Modelo de documento, camadas, historico e composicao do Orvalith"

[dependencies]
cosmic-text = "0.19.0"
crc32fast = "1.5.3"
flate2 = "1.1.10"
hayro = { version = "0.8.0", features = ["embed-fonts"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "tga", "ico", "qoi", "pnm", "hdr", "exr"] }
moxcms = "0.9.1"
pdf-writer = "0.15.0"
resvg = "0.48.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
lopdf = "0.46.0"
