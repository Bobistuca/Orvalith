[package]
name = "orvalith-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Modelo de documento, camadas, historico e composicao do Orvalith"

[dependencies]
cosmic-text = "0.19.0"
crc32fast = "1.5.3"
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
moxcms = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"
